<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR TEST VERSION 5</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<h2 id="version-test">VERSION 5</h2>

    <div id="instructions">
        Point the complete Apple page toward the camera.
    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./assets/targets.mind;
            autoStart: true;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <a-entity
            id="apple-target"
            mindar-image-target="targetIndex: 0"
        >
            <a-plane
                position="0 0 0.02"
                width="1"
                height="1.4"
                material="
                    color: red;
                    opacity: 0.85;
                    transparent: true;
                    side: double;
                "
            ></a-plane>
        </a-entity>

    </a-scene>

</body>

</html>
