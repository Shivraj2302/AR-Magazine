<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Magazine - A for Apple</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        /* Full-screen AR camera */
        a-scene {
            position: fixed !important;
            inset: 0;
            width: 100vw !important;
            height: 100dvh !important;
        }

        .a-canvas {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
        }

        /* Hide VR button */
        .a-enter-vr-button {
            display: none !important;
        }

        /* Opening screen */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 5000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px;
            box-sizing: border-box;

            text-align: center;
            background: white;
        }

        #start-screen h1 {
            margin: 0 0 12px;
            color: #d71920;
        }

        #start-screen p {
            max-width: 430px;
            margin: 0;
            line-height: 1.5;
            color: #333;
        }

        #start-button {
            margin-top: 24px;
            padding: 15px 30px;

            border: none;
            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;

            color: white;
            background: #e53935;

            cursor: pointer;
        }

        #start-button:disabled {
            opacity: 0.6;
        }

        /* Instruction message */
        #instructions {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 3500;

            display: none;

            width: 88%;
            max-width: 450px;
            padding: 12px;

            box-sizing: border-box;
            border-radius: 10px;

            text-align: center;
            font-size: 16px;

            color: white;
            background: rgba(0, 0, 0, 0.72);

            transform: translateX(-50%);
        }

        /*
         * Fixed video container.
         * It is connected to the mobile screen,
         * not to the printed Apple target.
         */
        #video-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 4000;

            display: none;

            width: 94vw;
            max-width: 900px;
            aspect-ratio: 16 / 9;

            border: 4px solid white;
            border-radius: 14px;

            box-sizing: border-box;
            overflow: hidden;

            background: black;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);

            transform: translate(-50%, -50%);
        }

        #apple-video {
            display: block;

            width: 100%;
            height: 100%;

            background: black;

            /*
             * contain = shows the complete video.
             * No cropping and no stretching.
             */
            object-fit: contain;
        }

        /* Close button */
        #close-video {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;

            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            font-size: 22px;
            font-weight: bold;
            line-height: 38px;

            color: white;
            background: rgba(0, 0, 0, 0.7);

            cursor: pointer;
        }

        /*
         * When the phone is held horizontally,
         * limit video height so it remains visible.
         */
        @media screen and (orientation: landscape) {
            #video-overlay {
                width: auto;
                height: 88dvh;
                max-height: 88dvh;
                aspect-ratio: 16 / 9;
            }

            #instructions {
                top: 8px;
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Start screen -->
    <div id="start-screen">
        <h1>A for Apple AR</h1>

        <p>
            Tap the button, allow camera access and point the camera
            at the complete Apple page.
        </p>

        <button id="start-button">
            Start AR with Sound
        </button>
    </div>

    <!-- Instructions -->
    <div id="instructions">
        Point the camera at the complete Apple page.
    </div>

    <!-- Fixed horizontal video box -->
    <div id="video-overlay">

        <button
            id="close-video"
            aria-label="Close video"
        >
            ×
        </button>

        <video
            id="apple-video"
            src="./assets/apple-video.mp4"
            preload="auto"
            playsinline
            webkit-playsinline
        ></video>

    </div>

    <!-- MindAR camera scene -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./assets/targets.mind;
            autoStart: false;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
            filterMinCF: 0.001;
            filterBeta: 0.01;
            warmupTolerance: 3;
            missTolerance: 8;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <!--
            This entity only detects the Apple page.
            No video plane is placed inside it.
        -->
        <a-entity
            id="apple-target"
            mindar-image-target="targetIndex: 0"
        ></a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const target = document.querySelector("#apple-target");

        const startScreen =
            document.querySelector("#start-screen");

        const startButton =
            document.querySelector("#start-button");

        const instructions =
            document.querySelector("#instructions");

        const videoOverlay =
            document.querySelector("#video-overlay");

        const video =
            document.querySelector("#apple-video");

        const closeVideoButton =
            document.querySelector("#close-video");

        let videoOpened = false;
        let targetLostTimer = null;

        /*
         * Start button:
         * 1. Unlock sound.
         * 2. Start the camera.
         */
        startButton.addEventListener("click", async () => {
            startButton.disabled = true;
            startButton.textContent = "Starting camera...";

            try {
                /*
                 * Unlock sound using the user's tap.
                 */
                video.muted = false;
                video.volume = 1;
                video.currentTime = 0;

                await video.play();

                video.pause();
                video.currentTime = 0;

                /*
                 * Start MindAR camera.
                 */
                await scene.systems[
                    "mindar-image-system"
                ].start();

                startScreen.style.display = "none";
                instructions.style.display = "block";

                instructions.textContent =
                    "Point the camera at the complete Apple page.";
            } catch (error) {
                console.error("AR start error:", error);

                startButton.disabled = false;
                startButton.textContent = "Try Again";

                alert(
                    "Camera or audio could not start. " +
                    "Allow camera permission and try again."
                );
            }
        });

        /*
         * When the Apple page is detected:
         * Show the fixed centered video box.
         */
        target.addEventListener("targetFound", async () => {
            if (targetLostTimer) {
                clearTimeout(targetLostTimer);
                targetLostTimer = null;
            }

            instructions.textContent =
                "Apple page detected!";

            /*
             * Prevent repeated targetFound events
             * from restarting the video.
             */
            if (videoOpened) {
                return;
            }

            videoOpened = true;

            videoOverlay.style.display = "block";

            try {
                video.muted = false;
                video.volume = 1;
                video.currentTime = 0;

                await video.play();
            } catch (error) {
                console.error(
                    "Video playback error:",
                    error
                );

                instructions.textContent =
                    "Tap the video once to start playback.";
            }
        });

        /*
         * The video remains fixed even if tracking
         * is briefly lost.
         */
        target.addEventListener("targetLost", () => {
            instructions.textContent =
                "Apple page lost. Keep the page visible.";

            /*
             * Do not instantly hide the video.
             * Wait two seconds.
             */
            targetLostTimer = setTimeout(() => {
                instructions.textContent =
                    "Point the camera at the Apple page again.";
            }, 2000);
        });

        /*
         * Close button.
         */
        closeVideoButton.addEventListener("click", () => {
            video.pause();
            video.currentTime = 0;

            videoOverlay.style.display = "none";

            videoOpened = false;

            instructions.textContent =
                "Point the camera at the Apple page to replay.";
        });

        /*
         * Reset when the video finishes.
         */
        video.addEventListener("ended", () => {
            video.pause();
            video.currentTime = 0;

            videoOverlay.style.display = "none";

            videoOpened = false;

            instructions.textContent =
                "Video finished. Scan the Apple page again.";
        });

        /*
         * Backup: tap the video to play it
         * if the browser pauses it.
         */
        video.addEventListener("click", async () => {
            if (!video.paused) {
                return;
            }

            try {
                video.muted = false;
                video.volume = 1;
                await video.play();
            } catch (error) {
                console.error(
                    "Manual playback error:",
                    error
                );
            }
        });
    </script>

</body>

</html>
