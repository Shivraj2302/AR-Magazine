<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Magazine - A for Apple</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        /* Full-screen AR camera */
        a-scene {
            position: fixed !important;
            inset: 0;
            width: 100vw !important;
            height: 100dvh !important;
        }

        .a-canvas {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
        }

        /* Hide A-Frame VR button */
        .a-enter-vr-button {
            display: none !important;
        }

        /* Starting screen */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 6000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 28px;
            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #fff7dd 0%,
                    #ffffff 55%,
                    #ffe5e5 100%
                );
        }

        #start-screen h1 {
            margin: 0 0 12px;
            font-size: 34px;
            color: #d71920;
        }

        #start-screen .apple-icon {
            margin-bottom: 12px;
            font-size: 72px;
        }

        #start-screen p {
            max-width: 430px;
            margin: 0;

            font-size: 17px;
            line-height: 1.55;
            color: #333;
        }

        #start-button {
            margin-top: 26px;
            padding: 15px 32px;

            border: none;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            color: white;
            background: #e53935;

            box-shadow: 0 6px 18px rgba(229, 57, 53, 0.35);

            cursor: pointer;
        }

        #start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Instruction message */
        #instructions {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 4000;

            display: none;

            width: 88%;
            max-width: 460px;

            padding: 12px 15px;
            border-radius: 12px;

            text-align: center;
            font-size: 16px;

            color: white;
            background: rgba(0, 0, 0, 0.72);

            transform: translateX(-50%);
        }

        /*
         * Background shown around the video.
         * The camera remains visible through it.
         */
        #video-backdrop {
            position: fixed;
            inset: 0;
            z-index: 4500;

            display: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 105, 105, 0.28),
                    rgba(255, 213, 128, 0.22),
                    rgba(128, 196, 255, 0.25)
                );

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            opacity: 0;
            transition: opacity 0.35s ease;
        }

        #video-backdrop.visible {
            opacity: 1;
        }

        /* Fixed video box */
        #video-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 5000;

            display: none;

            width: min(94vw, 900px);
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border: 4px solid white;
            border-radius: 16px;

            background: black;

            box-shadow:
                0 12px 45px rgba(0, 0, 0, 0.75),
                0 0 30px rgba(255, 255, 255, 0.18);

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.88);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        #video-overlay.visible {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        #apple-video {
            display: block;

            width: 100%;
            height: 100%;

            background: black;

            /*
             * contain:
             * Displays the complete 1920 × 1080 video.
             * It does not stretch or crop it.
             */
            object-fit: contain;
        }

        /* Close button */
        #close-video {
            position: absolute;
            top: 9px;
            right: 9px;
            z-index: 10;

            width: 40px;
            height: 40px;

            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;

            font-size: 24px;
            font-weight: bold;
            line-height: 34px;

            color: white;
            background: rgba(0, 0, 0, 0.72);

            cursor: pointer;
        }

        /* Replay screen shown after video completes */
        #replay-panel {
            position: absolute;
            inset: 0;
            z-index: 8;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.72);
        }

        #replay-panel h2 {
            margin: 0 0 15px;
            font-size: 26px;
        }

        #replay-button {
            padding: 13px 26px;

            border: none;
            border-radius: 10px;

            font-size: 17px;
            font-weight: bold;

            color: white;
            background: #e53935;

            cursor: pointer;
        }

        /* Landscape phone layout */
        @media screen and (orientation: landscape) {
            #video-overlay {
                width: auto;
                height: 88dvh;
                max-width: 94vw;
                aspect-ratio: 16 / 9;
            }

            #instructions {
                top: 7px;
                padding: 8px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Opening screen -->
    <div id="start-screen">

        <div class="apple-icon">🍎</div>

        <h1>A for Apple AR</h1>

        <p>
            Tap the button, allow camera access and point your phone
            at the complete A for Apple page.
        </p>

        <button id="start-button">
            Start AR with Sound
        </button>

    </div>

    <!-- Camera instructions -->
    <div id="instructions">
        Point the camera at the complete A for Apple page.
    </div>

    <!-- Custom background around the video -->
    <div id="video-backdrop"></div>

    <!-- Fixed centred video -->
    <div id="video-overlay">

        <button
            id="close-video"
            aria-label="Close video"
        >
            ×
        </button>

        <video
            id="apple-video"
            src="./assets/apple-video.mp4"
            preload="auto"
            playsinline
            webkit-playsinline
        ></video>

        <div id="replay-panel">

            <h2>A for Apple 🍎</h2>

            <button id="replay-button">
                Play Again
            </button>

        </div>

    </div>

    <!-- AR camera scene -->
    <a-scene
        mindar-image="
            imageTargetSrc: ./assets/targets.mind;
            autoStart: false;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
            filterMinCF: 0.001;
            filterBeta: 0.01;
            warmupTolerance: 3;
            missTolerance: 8;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <!-- This entity is only for detecting the Apple page -->
        <a-entity
            id="apple-target"
            mindar-image-target="targetIndex: 0"
        ></a-entity>

    </a-scene>

    <script>
        const scene =
            document.querySelector("a-scene");

        const target =
            document.querySelector("#apple-target");

        const startScreen =
            document.querySelector("#start-screen");

        const startButton =
            document.querySelector("#start-button");

        const instructions =
            document.querySelector("#instructions");

        const videoBackdrop =
            document.querySelector("#video-backdrop");

        const videoOverlay =
            document.querySelector("#video-overlay");

        const video =
            document.querySelector("#apple-video");

        const closeVideoButton =
            document.querySelector("#close-video");

        const replayPanel =
            document.querySelector("#replay-panel");

        const replayButton =
            document.querySelector("#replay-button");

        let videoIsOpen = false;
        let targetLostTimer = null;

        /*
         * Display the fixed video box.
         */
        function showVideoOverlay() {
            videoBackdrop.style.display = "block";
            videoOverlay.style.display = "block";

            requestAnimationFrame(() => {
                videoBackdrop.classList.add("visible");
                videoOverlay.classList.add("visible");
            });
        }

        /*
         * Hide the fixed video box smoothly.
         */
        function hideVideoOverlay() {
            videoBackdrop.classList.remove("visible");
            videoOverlay.classList.remove("visible");

            setTimeout(() => {
                videoBackdrop.style.display = "none";
                videoOverlay.style.display = "none";
            }, 350);
        }

        /*
         * Play the Apple video from the beginning.
         */
        async function playAppleVideo() {
            replayPanel.style.display = "none";

            video.muted = false;
            video.volume = 1;
            video.currentTime = 0;

            try {
                await video.play();

                instructions.textContent =
                    "A for Apple video is playing!";
            } catch (error) {
                console.error(
                    "Video playback error:",
                    error
                );

                instructions.textContent =
                    "Tap the video once to start playback.";
            }
        }

        /*
         * Start button:
         * Unlock audio and start the MindAR camera.
         */
        startButton.addEventListener("click", async () => {
            startButton.disabled = true;
            startButton.textContent = "Starting camera...";

            try {
                /*
                 * Unlock audio using a real user interaction.
                 */
                video.muted = false;
                video.volume = 1;
                video.currentTime = 0;

                await video.play();

                video.pause();
                video.currentTime = 0;

                /*
                 * Start the camera.
                 */
                await scene.systems[
                    "mindar-image-system"
                ].start();

                startScreen.style.display = "none";
                instructions.style.display = "block";

                instructions.textContent =
                    "Point the camera at the complete A for Apple page.";
            } catch (error) {
                console.error(
                    "Camera or audio start error:",
                    error
                );

                startButton.disabled = false;
                startButton.textContent = "Try Again";

                alert(
                    "Camera or audio could not start. " +
                    "Allow camera permission and try again."
                );
            }
        });

        /*
         * Apple page detected.
         */
        target.addEventListener("targetFound", async () => {
            if (targetLostTimer) {
                clearTimeout(targetLostTimer);
                targetLostTimer = null;
            }

            instructions.textContent =
                "Apple page detected!";

            /*
             * Do not restart the video repeatedly
             * while the target remains visible.
             */
            if (videoIsOpen) {
                return;
            }

            videoIsOpen = true;

            showVideoOverlay();
            await playAppleVideo();
        });

        /*
         * Apple target lost.
         * The video remains fixed and continues playing.
         */
        target.addEventListener("targetLost", () => {
            instructions.textContent =
                "Apple page lost. Keep the page visible.";

            targetLostTimer = setTimeout(() => {
                instructions.textContent =
                    "Point the camera at the Apple page again.";
            }, 2000);
        });

        /*
         * Close the video manually.
         */
        closeVideoButton.addEventListener("click", () => {
            video.pause();
            video.currentTime = 0;

            replayPanel.style.display = "none";

            hideVideoOverlay();

            videoIsOpen = false;

            instructions.textContent =
                "Point the camera at the Apple page to play again.";
        });

        /*
         * Show replay button after the video finishes.
         */
        video.addEventListener("ended", () => {
            video.pause();
            video.currentTime = 0;

            replayPanel.style.display = "flex";

            instructions.textContent =
                "Video completed. Tap Play Again or close it.";
        });

        /*
         * Replay the video.
         */
        replayButton.addEventListener("click", async () => {
            await playAppleVideo();
        });

        /*
         * Backup manual playback.
         */
        video.addEventListener("click", async () => {
            if (!video.paused) {
                return;
            }

            try {
                video.muted = false;
                video.volume = 1;

                await video.play();
            } catch (error) {
                console.error(
                    "Manual video playback error:",
                    error
                );
            }
        });
    </script>

</body>

</html>
