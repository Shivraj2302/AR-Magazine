<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Magazine - A for Apple</title>

    <!-- A-Frame library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR image tracking library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100dvh !important;
        }

        .a-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
        }

        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            z-index: 1000;

            width: 88%;
            max-width: 450px;
            padding: 14px;

            box-sizing: border-box;
            border-radius: 12px;

            text-align: center;
            font-size: 18px;
            color: white;
            background: rgba(0, 0, 0, 0.72);

            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <div id="instructions">
        Point the complete Apple page toward the camera.
    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./assets/targets.mind;
            autoStart: true;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>
            <video
                id="apple-video"
                src="./assets/apple-video.mp4"
                preload="auto"
                muted
                loop
                playsinline
                webkit-playsinline
            ></video>
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <a-entity
            id="apple-target"
            mindar-image-target="targetIndex: 0"
        >

            <a-plane
                position="0 0 0.02"
                width="1"
                height="1.4"
                material="
                    src: #apple-video;
                    shader: flat;
                    side: double;
                "
            ></a-plane>

        </a-entity>

    </a-scene>

    <script>
        const target = document.querySelector("#apple-target");
        const video = document.querySelector("#apple-video");
        const instructions = document.querySelector("#instructions");

        target.addEventListener("targetFound", async () => {
            instructions.textContent = "Apple page detected!";

            try {
                video.currentTime = 0;
                await video.play();
            } catch (error) {
                console.error("Video playback error:", error);

                instructions.textContent =
                    "Apple detected, but the video could not play.";
            }
        });

        target.addEventListener("targetLost", () => {
            video.pause();

            instructions.textContent =
                "Target lost. Point the camera at the Apple page again.";
        });
    </script>

</body>

</html>
