<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Magazine - A for Apple</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100dvh !important;
        }

        .a-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
        }

        /* Opening screen */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 3000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            background: white;
        }

        #start-screen h1 {
            margin: 0 0 12px;
            color: #d71920;
        }

        #start-screen p {
            max-width: 420px;
            margin: 0;
            line-height: 1.5;
            color: #333;
        }

        #start-button {
            margin-top: 25px;
            padding: 15px 30px;

            border: none;
            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #e53935;

            cursor: pointer;
        }

        #start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Camera instructions */
        #instructions {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 2000;

            display: none;
            width: 88%;
            max-width: 450px;
            padding: 14px;

            box-sizing: border-box;
            border-radius: 12px;

            text-align: center;
            font-size: 18px;
            color: white;
            background: rgba(0, 0, 0, 0.72);

            transform: translateX(-50%);
        }
    </style>
</head>

<body>

    <!-- The user must tap this button to permit sound -->
    <div id="start-screen">
        <h1>A for Apple AR</h1>

        <p>
            Tap the button, allow camera access and point your phone
            at the complete Apple page.
        </p>

        <button id="start-button">
            Start AR with Sound
        </button>
    </div>

    <div id="instructions">
        Point the complete Apple page toward the camera.
    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./assets/targets.mind;
            autoStart: false;
        "
        color-space="sRGB"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets timeout="15000">
            <video
                id="apple-video"
                src="./assets/apple-video.mp4"
                preload="auto"
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
            ></video>
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>

        <a-entity
            id="apple-target"
            mindar-image-target="targetIndex: 0"
        >
            <a-plane
                position="0 0 0.02"
                width="1"
                height="1.4"
                material="
                    src: #apple-video;
                    shader: flat;
                    side: double;
                "
            ></a-plane>
        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const target = document.querySelector("#apple-target");
        const video = document.querySelector("#apple-video");

        const startScreen = document.querySelector("#start-screen");
        const startButton = document.querySelector("#start-button");
        const instructions = document.querySelector("#instructions");

        let targetIsVisible = false;

        /*
         * The user button click unlocks sound and starts the camera.
         */
        startButton.addEventListener("click", async () => {
            startButton.disabled = true;
            startButton.textContent = "Starting camera...";

            try {
                /*
                 * Start the video once during the user click.
                 * This gives the browser permission to play it with sound later.
                 */
                video.muted = false;
                video.volume = 1;
                video.currentTime = 0;

                await video.play();

                video.pause();
                video.currentTime = 0;

                /*
                 * Start MindAR and request camera permission.
                 */
                await scene.systems["mindar-image-system"].start();

                startScreen.style.display = "none";
                instructions.style.display = "block";

                instructions.textContent =
                    "Point the complete Apple page toward the camera.";
            } catch (error) {
                console.error("AR start error:", error);

                startButton.disabled = false;
                startButton.textContent = "Try Again";

                alert(
                    "The camera or audio could not start. " +
                    "Please allow camera permission and make sure media volume is turned up."
                );
            }
        });

        /*
         * Play the video when the Apple page is detected.
         */
        target.addEventListener("targetFound", async () => {
            targetIsVisible = true;

            instructions.textContent = "Apple page detected!";

            try {
                video.pause();
                video.currentTime = 0;
                video.muted = false;
                video.volume = 1;

                await video.play();

                console.log("Apple video started with sound.");
            } catch (error) {
                console.error("Video playback error:", error);

                instructions.textContent =
                    "Apple detected. Tap the screen once to enable sound.";
            }
        });

        /*
         * Pause the video when the target disappears.
         */
        target.addEventListener("targetLost", () => {
            targetIsVisible = false;
            video.pause();

            instructions.textContent =
                "Target lost. Point the camera at the Apple page again.";
        });

        /*
         * Backup option:
         * If Chrome still blocks sound, tapping the camera starts it.
         */
        document.body.addEventListener("click", async () => {
            if (!targetIsVisible || !video.paused) {
                return;
            }

            try {
                video.muted = false;
                video.volume = 1;
                await video.play();

                instructions.textContent = "Apple video playing!";
            } catch (error) {
                console.error("Tap-to-play error:", error);
            }
        });
    </script>

</body>

</html>
